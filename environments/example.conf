# One file per environment. Generate its compose file with:
#   ./craft compose environments/example.conf
# which writes environments/example/docker-compose.yml.

### Public domain the dashboard should be accessible at
DOMAIN=craft.example.com

### Container register for pushing built images
#REGISTRY=registry.lan:5000 # use some local registry
#REGISTRY=ghcr.io/goodieshq # use goodieshq GitHub or some other GHCR
REGISTRY=goodieshq # use goodieshq DockerHub

### Slugs from apps.conf, space or comma separated, or "all".
APPS=photo light word grid
#APPS=all

### Image tag per app. Defaults to DEFAULT_VERSION (latest).
# PHOTO_VERSION=0.7.0
# LIGHT_VERSION=0.3.0
# WORD_VERSION=0.5.2
# GRID_VERSION=0.6.1
# etc...
DEFAULT_VERSION=latest

### Dashboard heading.
TITLE=ArtCraft

### Docker Compose project name (and Traefik router name prefix) unique per Traefik instance
PROJECT=craft

### Traefik information
# Network the conainers should be attached to
NETWORK=proxy
# Router entrypoint, typically either "web" or "websecure"
ENTRYPOINT=websecure
# Refer to your Traefik cert resolver, leave blank if Traefik already has a default/wildcard cert
CERTRESOLVER=
# middleware applied to the dashboard and every app, comma-separated, e.g. for auth gateway in front of apps
#MIDDLEWARES=authentik@docker
MIDDLEWARES=
