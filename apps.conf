# Catalog of craft apps. `craft update` builds every app listed here; each environment's
# .conf picks which of them to deploy.
#
# Columns (whitespace-separated):
#   name    image name and the <name> in the release asset <name>-web-<version>.zip
#   slug    URL path: https://<domain>/<slug>/ (also used in environment .conf keys)
#   title   label on the dashboard (no spaces)
#   repo    GitHub owner/repo that publishes releases (tags look like v0.7.0)
#   asset   optional: asset file name if it doesn't follow <name>-web-<version>.zip.
#           Placeholders: {name} {version}. A full https:// URL is also accepted.
#
# name          slug        title           repo                        [asset]
photocraft      photo       PhotoCraft      storytold/photocraft
vectorcraft     vector      VectorCraft     storytold/vectorcraft
filmcraft       film        FilmCraft       storytold/filmcraft
lightcraft      light       LightCraft      storytold/lightcraft
pdfcraft        pdf         PDFCraft        storytold/pdfcraft
effectcraft     effect      EffectCraft     storytold/effectcraft
designcraft     design      DesignCraft     storytold/designcraft
wordcraft       word        WordCraft       storytold/wordcraft 
deckcraft       deck        DeckCraft       storytold/deckcraft 
gridcraft       grid        GridCraft       storytold/gridcraft 
cadcraft        cad         CADCraft        storytold/cadcraft 
soundcraft      sound       SoundCraft      storytold/soundcraft 
figcraft        fig         FigCraft        storytold/figcraft 
